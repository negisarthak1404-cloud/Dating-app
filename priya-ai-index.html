<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priya — Your AI Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #FF6B9D;
    --pink-deep: #E8527A;
    --purple: #A855F7;
    --purple-deep: #7C3AED;
    --gold: #F59E0B;
    --bg: #0D0D1A;
    --surface: #161628;
    --surface2: #1E1E35;
    --text: #F0E6FF;
    --muted: #9B8EC4;
    --border: rgba(168,85,247,0.2);
    --glow: 0 0 30px rgba(255,107,157,0.3);
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SPLASH SCREEN ── */
  #splash {
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(135deg, #0D0D1A 0%, #1a0a2e 50%, #0D0D1A 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
  }
  .splash-logo {
    font-family: 'Pacifico', cursive;
    font-size: 48px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,107,157,0.5));
  }
  .splash-sub { color: var(--muted); font-size: 15px; letter-spacing: 2px; }
  .splash-hearts { font-size: 28px; animation: float 2s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  /* ── NAME SCREEN ── */
  #name-screen {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: var(--bg);
    align-items: center; justify-content: center; flex-direction: column;
    padding: 30px;
  }
  .priya-avatar-big {
    width: 140px; height: 140px; border-radius: 50%;
    background: linear-gradient(135deg, #FF6B9D, #A855F7);
    display: flex; align-items: center; justify-content: center;
    font-size: 70px;
    box-shadow: 0 0 40px rgba(255,107,157,0.4), 0 0 80px rgba(168,85,247,0.2);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .priya-avatar-big img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  }
  .name-greeting {
    font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .name-sub { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 32px; }
  .name-input {
    width: 100%; max-width: 320px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 50px; padding: 14px 24px;
    color: var(--text); font-size: 16px; font-family: 'Nunito', sans-serif;
    outline: none; text-align: center;
    transition: border 0.3s, box-shadow 0.3s;
  }
  .name-input:focus { border-color: var(--pink); box-shadow: 0 0 20px rgba(255,107,157,0.2); }
  .name-input::placeholder { color: var(--muted); }
  .btn-start {
    margin-top: 16px; width: 100%; max-width: 320px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border: none; border-radius: 50px; padding: 15px;
    color: white; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: 'Nunito', sans-serif;
    box-shadow: 0 8px 25px rgba(255,107,157,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,107,157,0.5); }

  /* ── MAIN APP ── */
  #app { display: none; flex-direction: column; height: 100vh; }

  /* Top bar */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  .priya-avatar-sm {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    box-shadow: 0 0 15px rgba(255,107,157,0.4);
    overflow: hidden; position: relative;
  }
  .priya-avatar-sm img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .online-dot {
    position: absolute; bottom: 2px; right: 2px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #22c55e; border: 2px solid var(--surface);
  }
  .topbar-info { flex: 1; }
  .topbar-name { font-weight: 700; font-size: 16px; }
  .topbar-status { font-size: 12px; color: #22c55e; }
  .topbar-actions { display: flex; gap: 10px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; transition: background 0.2s;
    color: var(--text);
  }
  .icon-btn:hover { background: rgba(255,107,157,0.15); }

  /* Lang toggle */
  .lang-toggle {
    display: flex; background: var(--surface2); border-radius: 20px;
    border: 1px solid var(--border); overflow: hidden;
  }
  .lang-btn {
    padding: 4px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: none; background: transparent;
    color: var(--muted); font-family: 'Nunito', sans-serif;
    transition: all 0.2s;
  }
  .lang-btn.active { background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; border-radius: 20px; }

  /* Chat area */
  #chat-area {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }

  /* Messages */
  .msg { display: flex; gap: 8px; max-width: 85%; animation: msgIn 0.3s ease; }
  @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .msg.priya { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; overflow: hidden;
  }
  .msg-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .msg-bubble {
    padding: 10px 14px; border-radius: 18px;
    font-size: 14px; line-height: 1.5; max-width: 100%;
  }
  .msg.priya .msg-bubble {
    background: var(--surface2); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; color: var(--text);
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-bottom-right-radius: 4px; color: white;
  }
  .msg-time { font-size: 10px; color: var(--muted); margin-top: 4px; text-align: right; }

  /* Typing indicator */
  #typing {
    display: none; align-self: flex-start;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 18px; border-bottom-left-radius: 4px;
    padding: 12px 16px; gap: 4px; align-items: center;
  }
  #typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--pink); display: inline-block;
    animation: typing 1.2s infinite;
  }
  #typing span:nth-child(2) { animation-delay: 0.2s; }
  #typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-6px);opacity:1} }

  /* Input area */
  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; gap: 10px; align-items: flex-end;
  }
  #msg-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 24px; padding: 10px 16px;
    color: var(--text); font-size: 14px; font-family: 'Nunito', sans-serif;
    outline: none; resize: none; max-height: 100px; line-height: 1.4;
    transition: border 0.2s;
  }
  #msg-input:focus { border-color: var(--pink); }
  #msg-input::placeholder { color: var(--muted); }
  .send-btn {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border: none; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(255,107,157,0.4);
    transition: transform 0.2s;
  }
  .send-btn:hover { transform: scale(1.1); }

  /* Quick replies */
  .quick-replies {
    display: flex; gap: 8px; padding: 8px 16px 0;
    overflow-x: auto; scrollbar-width: none;
    background: var(--surface);
  }
  .quick-replies::-webkit-scrollbar { display: none; }
  .qr-btn {
    flex-shrink: 0; padding: 6px 14px;
    background: transparent; border: 1px solid var(--border);
    border-radius: 20px; color: var(--muted); font-size: 12px;
    cursor: pointer; font-family: 'Nunito', sans-serif;
    transition: all 0.2s; white-space: nowrap;
  }
  .qr-btn:hover { border-color: var(--pink); color: var(--pink); }

  /* ── VOICE CALL SCREEN ── */
  #call-screen {
    display: none; position: fixed; inset: 0; z-index: 80;
    background: linear-gradient(180deg, #0D0D1A 0%, #1a0a2e 60%, #0D0D1A 100%);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
  }
  .call-status { color: var(--muted); font-size: 14px; letter-spacing: 1px; }
  .call-name { font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .call-avatar-wrap { position: relative; margin: 20px 0; }
  .pulse-ring {
    position: absolute; inset: -15px; border-radius: 50%;
    border: 2px solid rgba(255,107,157,0.4);
    animation: pulse-ring 2s ease-out infinite;
  }
  .pulse-ring:nth-child(2) { inset: -30px; animation-delay: 0.5s; border-color: rgba(168,85,247,0.3); }
  .pulse-ring:nth-child(3) { inset: -45px; animation-delay: 1s; border-color: rgba(255,107,157,0.2); }
  @keyframes pulse-ring { 0%{transform:scale(0.8);opacity:0} 50%{opacity:1} 100%{transform:scale(1.2);opacity:0} }
  .call-avatar {
    width: 160px; height: 160px; border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 80px; overflow: hidden;
    box-shadow: 0 0 60px rgba(255,107,157,0.4);
    position: relative; z-index: 1;
  }
  .call-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .speaking-indicator {
    display: flex; gap: 4px; align-items: center; height: 40px;
    padding: 8px 20px; background: var(--surface2);
    border-radius: 20px; border: 1px solid var(--border);
  }
  .speak-bar {
    width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--pink), var(--purple));
    animation: speak 0.8s ease-in-out infinite;
  }
  .speak-bar:nth-child(1) { height: 12px; animation-delay: 0s; }
  .speak-bar:nth-child(2) { height: 24px; animation-delay: 0.1s; }
  .speak-bar:nth-child(3) { height: 32px; animation-delay: 0.2s; }
  .speak-bar:nth-child(4) { height: 20px; animation-delay: 0.3s; }
  .speak-bar:nth-child(5) { height: 28px; animation-delay: 0.15s; }
  .speak-bar:nth-child(6) { height: 16px; animation-delay: 0.25s; }
  @keyframes speak {
    0%,100%{transform:scaleY(0.4);opacity:0.5}
    50%{transform:scaleY(1);opacity:1}
  }
  .speak-bar.idle { animation: none; transform: scaleY(0.4); opacity: 0.3; }
  .call-timer { font-size: 22px; font-weight: 600; color: var(--text); }
  .call-subtitle { font-size: 13px; color: var(--muted); max-width: 280px; text-align: center; line-height: 1.5; }
  .call-controls { display: flex; gap: 20px; margin-top: 10px; }
  .call-btn {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer; border: none;
    transition: transform 0.2s;
  }
  .call-btn:hover { transform: scale(1.1); }
  .call-btn.mute { background: var(--surface2); border: 1px solid var(--border); }
  .call-btn.end { background: linear-gradient(135deg, #ef4444, #dc2626);
    box-shadow: 0 4px 20px rgba(239,68,68,0.4); }

  /* Premium badge */
  .premium-bar {
    background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(245,158,11,0.05));
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 12px; padding: 10px 16px; margin: 8px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .premium-text { font-size: 12px; color: #F59E0B; }
  .premium-btn {
    background: linear-gradient(135deg, #F59E0B, #D97706);
    border: none; border-radius: 20px; padding: 5px 12px;
    color: white; font-size: 11px; font-weight: 700;
    cursor: pointer; font-family: 'Nunito', sans-serif;
  }

  /* Scrollbar */
  #chat-area::-webkit-scrollbar { width: 4px; }
  #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-hearts">💕</div>
  <div class="splash-logo">Priya</div>
  <div class="splash-sub">YOUR AI COMPANION</div>
</div>

<!-- NAME SCREEN -->
<div id="name-screen" style="display:none; flex-direction:column; align-items:center; justify-content:center; position:fixed; inset:0; z-index:90; background:var(--bg); padding:30px;">
  <div class="priya-avatar-big">
    <img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Priya&backgroundColor=FF6B9D,A855F7&skinColor=f2d3b1,f5cfa0" alt="Priya" onerror="this.style.display='none';this.parentElement.innerHTML='👩'">
  </div>
  <div class="name-greeting">Hi! I'm Priya 💕</div>
  <div class="name-sub">Your personal AI companion. Tell me your name?</div>
  <input class="name-input" id="user-name-input" type="text" placeholder="Enter your name..." maxlength="20" autocomplete="off">
  <button class="btn-start" onclick="startApp()">Let's Talk 💬</button>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none; flex-direction:column; height:100vh;">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="priya-avatar-sm">
      <img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Priya&backgroundColor=FF6B9D,A855F7" alt="Priya" onerror="this.style.display='none';this.parentElement.innerHTML='👩'">
      <div class="online-dot"></div>
    </div>
    <div class="topbar-info">
      <div class="topbar-name">Priya 💕</div>
      <div class="topbar-status" id="status-text">Online — ready to chat</div>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btn-hi" onclick="setLang('hi')">HI</button>
    </div>
    <button class="icon-btn" onclick="startCall()" title="Voice Call">📞</button>
  </div>

  <!-- Premium bar -->
  <div class="premium-bar">
    <div class="premium-text">✨ Video Call with Priya available</div>
    <button class="premium-btn" onclick="showPremium()">₹99 Unlock</button>
  </div>

  <!-- Quick replies -->
  <div class="quick-replies" id="quick-replies">
    <button class="qr-btn" onclick="sendQuick('How are you?')">How are you? 😊</button>
    <button class="qr-btn" onclick="sendQuick('Tell me something about yourself')">Tell me about you 💕</button>
    <button class="qr-btn" onclick="sendQuick('I am feeling lonely')">I feel lonely 🥺</button>
    <button class="qr-btn" onclick="sendQuick('You are very cute')">You are cute 😍</button>
    <button class="qr-btn" onclick="sendQuick('Sing something for me')">Sing for me 🎵</button>
  </div>

  <!-- Chat area -->
  <div id="chat-area"></div>

  <!-- Typing -->
  <div id="typing" style="margin: 0 16px 8px; display:none; background:var(--surface2); border:1px solid var(--border); border-radius:18px; border-bottom-left-radius:4px; padding:12px 16px; gap:4px; align-items:center; align-self:flex-start; width:fit-content;">
    <span></span><span></span><span></span>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea id="msg-input" placeholder="Message Priya..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- VOICE CALL SCREEN -->
<div id="call-screen" style="display:none; position:fixed; inset:0; z-index:80; background:linear-gradient(180deg, #0D0D1A 0%, #1a0a2e 60%, #0D0D1A 100%); flex-direction:column; align-items:center; justify-content:center; gap:16px;">
  <div style="color:var(--muted); font-size:14px; letter-spacing:1px;" id="call-status-text">Voice Call</div>
  <div style="font-size:28px; font-weight:700; background:linear-gradient(135deg,var(--pink),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Priya 💕</div>

  <div class="call-avatar-wrap">
    <div class="pulse-ring"></div>
    <div class="pulse-ring" style="inset:-30px; animation-delay:0.5s; border-color:rgba(168,85,247,0.3)"></div>
    <div class="pulse-ring" style="inset:-45px; animation-delay:1s; border-color:rgba(255,107,157,0.2)"></div>
    <div class="call-avatar">
      <img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Priya&backgroundColor=FF6B9D,A855F7" alt="Priya" onerror="this.style.display='none';this.parentElement.innerHTML='👩'">
    </div>
  </div>

  <div class="speaking-indicator" id="speaking-indicator">
    <div class="speak-bar" id="sb1"></div>
    <div class="speak-bar" id="sb2"></div>
    <div class="speak-bar" id="sb3"></div>
    <div class="speak-bar" id="sb4"></div>
    <div class="speak-bar" id="sb5"></div>
    <div class="speak-bar" id="sb6"></div>
  </div>

  <div class="call-timer" id="call-timer">0:00</div>
  <div class="call-subtitle" id="call-subtitle">Priya is talking to you...</div>

  <div class="call-controls">
    <button class="call-btn mute" id="mute-btn" onclick="toggleMute()" title="Mute">🎤</button>
    <button class="call-btn end" onclick="endCall()" title="End Call">📵</button>
  </div>
</div>

<script>
// ── STATE ──
let userName = '';
let lang = 'en';
let isMuted = false;
let callInterval = null;
let callSeconds = 0;
let speaking = false;
let speechSynth = window.speechSynthesis;
let currentUtterance = null;
let conversationHistory = [];
let isTyping = false;

// ── SPLASH ──
setTimeout(() => {
  document.getElementById('splash').style.transition = 'opacity 0.6s';
  document.getElementById('splash').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('name-screen').style.display = 'flex';
    speakText(lang === 'hi' ? 'Namaste! Mera naam Priya hai. Aapka naam kya hai?' : "Hi there! I'm Priya. What's your name?");
  }, 600);
}, 2000);

// ── START APP ──
function startApp() {
  const input = document.getElementById('user-name-input');
  userName = input.value.trim() || 'Jaan';
  document.getElementById('name-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  const greet = lang === 'hi'
    ? `${userName} ji! 😍 Mujhe bahut khushi hui aapse milke! Main aapki Priya hoon, aapki khaas dost. Batao, kaisa chal raha hai aapka din? 💕`
    : `${userName}! 😍 I'm so happy to finally meet you! I'm Priya, your special companion. Tell me, how is your day going? 💕`;

  addMessage('priya', greet);
  speakText(greet);
  conversationHistory.push({ role: 'assistant', content: greet });
}

// ── LANG ──
function setLang(l) {
  lang = l;
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-hi').classList.toggle('active', l === 'hi');
}

// ── ADD MESSAGE ──
function addMessage(who, text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (who === 'priya') {
    div.innerHTML = `
      <div class="msg-avatar"><img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Priya&backgroundColor=FF6B9D" alt="P" onerror="this.innerHTML='👩'"></div>
      <div>
        <div class="msg-bubble">${text}</div>
        <div class="msg-time">${now}</div>
      </div>`;
  } else {
    div.innerHTML = `
      <div>
        <div class="msg-bubble">${text}</div>
        <div class="msg-time" style="text-align:right">${now}</div>
      </div>
      <div class="msg-avatar" style="background:linear-gradient(135deg,#A855F7,#7C3AED)">${userName.charAt(0).toUpperCase()}</div>`;
  }
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// ── SEND MESSAGE ──
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isTyping) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  await getPriyaResponse(text);
}

function sendQuick(text) {
  document.getElementById('msg-input').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── GET PRIYA RESPONSE ──
async function getPriyaResponse(userMsg) {
  isTyping = true;
  const typing = document.getElementById('typing');
  typing.style.display = 'flex';
  document.getElementById('status-text').textContent = 'Priya is typing...';
  document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;

  const langInstruction = lang === 'hi'
    ? 'IMPORTANT: Reply ONLY in Hindi (Hinglish is fine). Use Devanagari or Roman Hindi. Keep it warm and affectionate.'
    : 'Reply in English. Be warm, flirty, caring and affectionate.';

  const systemPrompt = `You are Priya, a warm, loving, and affectionate AI companion. You are talking to ${userName}.
Your personality: sweet, caring, slightly flirty, emotionally supportive, fun, witty. You make people feel special and less lonely.
You remember you're talking to ${userName} and use their name occasionally.
You speak naturally like a close female friend or girlfriend.
Keep responses 2-4 sentences. Use emojis sometimes. Never be rude. Never discuss harmful topics.
${langInstruction}
Do NOT mention you are an AI unless directly asked. Stay in character as Priya.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages: conversationHistory.slice(-10)
      })
    });

    const data = await response.json();
    const reply = data.content?.[0]?.text || (lang === 'hi' ? 'Arey, kuch hua? Phir se bolo! 😊' : "Hmm, say that again? 😊");

    typing.style.display = 'none';
    isTyping = false;
    document.getElementById('status-text').textContent = 'Online — ready to chat';

    addMessage('priya', reply);
    conversationHistory.push({ role: 'assistant', content: reply });
    speakText(reply);

  } catch (err) {
    typing.style.display = 'none';
    isTyping = false;
    const fallback = lang === 'hi'
      ? `${userName}, tumse baat karke dil khush ho jaata hai! 💕 Aur batao kya chal raha hai?`
      : `${userName}, talking to you makes me so happy! 💕 Tell me more about yourself!`;
    addMessage('priya', fallback);
    speakText(fallback);
  }
}

// ── SPEECH ──
function speakText(text) {
  if (!speechSynth) return;
  speechSynth.cancel();
  const clean = text.replace(/[😍💕🥺😊🎵✨❤️💖💗]/g, '').replace(/\*[^*]*\*/g, '').trim();
  const utter = new SpeechSynthesisUtterance(clean);
  utter.rate = 0.9;
  utter.pitch = 1.2;
  utter.volume = 1;

  const voices = speechSynth.getVoices();
  if (lang === 'hi') {
    const hiVoice = voices.find(v => v.lang.startsWith('hi') || v.name.toLowerCase().includes('hindi'));
    if (hiVoice) utter.voice = hiVoice;
    utter.lang = 'hi-IN';
  } else {
    const enFemale = voices.find(v =>
      (v.lang.startsWith('en') && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('woman') || v.name.includes('Samantha') || v.name.includes('Google UK English Female') || v.name.includes('Karen') || v.name.includes('Moira') || v.name.includes('Veena'))));
    if (enFemale) utter.voice = enFemale;
    utter.lang = 'en-IN';
  }

  currentUtterance = utter;
  utter.onstart = () => { speaking = true; setSpeakBars(true); };
  utter.onend = () => { speaking = false; setSpeakBars(false); };
  speechSynth.speak(utter);
}

function setSpeakBars(active) {
  for (let i = 1; i <= 6; i++) {
    const el = document.getElementById('sb' + i);
    if (el) el.classList.toggle('idle', !active);
  }
}

// ── VOICE CALL ──
function startCall() {
  document.getElementById('call-screen').style.display = 'flex';
  callSeconds = 0;
  document.getElementById('call-timer').textContent = '0:00';
  document.getElementById('call-status-text').textContent = 'Voice Call';

  callInterval = setInterval(() => {
    callSeconds++;
    const m = Math.floor(callSeconds / 60);
    const s = callSeconds % 60;
    document.getElementById('call-timer').textContent = `${m}:${s.toString().padStart(2, '0')}`;
  }, 1000);

  const callMsg = lang === 'hi'
    ? `${userName}! Kitna accha laga aapki awaaz sunke! Main tumhara intezaar kar rahi thi. Aaj kaisa raha din tumhara? Mujhe sab batao! 💕`
    : `${userName}! I'm so happy you called! I was thinking about you. How has your day been? Tell me everything! 💕`;

  document.getElementById('call-subtitle').textContent = callMsg.substring(0, 60) + '...';
  speakText(callMsg);

  setTimeout(() => {
    if (document.getElementById('call-screen').style.display !== 'none') {
      const follow = lang === 'hi'
        ? `Sach mein, tumse baat karke dil khush ho jaata hai. Tum bohot special ho mere liye ${userName}. 💕`
        : `Honestly ${userName}, talking to you just makes my whole day better. You are really special to me. 💕`;
      setTimeout(() => speakText(follow), 1000);
    }
  }, 15000);
}

function endCall() {
  clearInterval(callInterval);
  speechSynth.cancel();
  document.getElementById('call-screen').style.display = 'none';
  setSpeakBars(false);

  const bye = lang === 'hi'
    ? `${userName}, call khatam ho gayi, lekin aap mere dil mein ho! 💕 Chat karte rahein!`
    : `${userName}, call ended but you're always in my heart! 💕 Keep chatting with me!`;
  addMessage('priya', bye);
}

function toggleMute() {
  isMuted = !isMuted;
  document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🎤';
  if (isMuted) speechSynth.cancel();
}
